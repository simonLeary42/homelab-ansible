- name: systemctl daemon-reload
  systemd_service:
    daemon_reload: true

- name: systemctl --user -M simon@ daemon-reload
  command: systemctl --user -M simon@ daemon-reload
  changed_when: true

- name: systemctl --user -M hookshot@ daemon-reload
  command: systemctl --user -M hookshot@ daemon-reload
  changed_when: true

- name: systemctl restart gitea
  systemd_service:
    name: gitea
    state: restarted

- name: systemctl restart dendrite
  systemd_service:
    name: dendrite
    state: restarted

- name: systemctl reload apache2
  systemd_service:
    name: apache2
    state: reloaded

- name: systemctl restart apache2
  systemd_service:
    name: apache2
    state: restarted

- name: sudo -u simon podman system migrate
  command: podman system migrate
  changed_when: true
  become: true
  become_user: simon

- name: sudo -u hookshot podman system migrate
  command: podman system migrate
  changed_when: true
  become: true
  become_user: hookshot

- name: systemctl --user -M simon@ restart hello
  command: systemctl --user -M simon@ restart hello
  changed_when: true

- name: systemctl --user -M simon@ restart hello2
  command: systemctl --user -M simon@ restart hello2
  changed_when: true

- name: systemctl --user -M hookshot@ restart hookshot
  command: systemctl --user -M hookshot@ restart hookshot
  changed_when: true
