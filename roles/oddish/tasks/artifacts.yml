- name: install artifacts .envrc
  copy:
    content: |
      export API_TOKEN='{{ artifacts_api_token }}'
      export ACCOUNT='{{ artifacts_account }}'
      export NTFY_USERNAME=ntfyadmin
      export NTFY_PASSWORD='{{ ntfy_admin_password }}'
      export NTFY_URL='https://ntfy.{{ domain }}/{{ ntfy_oddish_topic }}'
      export IPYTHONDIR=$PWD/.ipython
    dest: /home/simon/artifacts/.envrc
    owner: simon
    group: simon
    mode: "0600"
