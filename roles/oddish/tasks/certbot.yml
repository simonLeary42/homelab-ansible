- name: apt install certbot
  apt:
    name: certbot
    state: present

- name: ensure certificate exists
  command:
    argv:
      - certbot
      - certonly
      - -m
      - "{{ letsencrypt_email }}"
      - --agree-tos
      - -n
      - --standalone
      - -d
      - "{{ domain }}"
    creates: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
