- name: setup secrets
  include_vars: secrets.yml
  tags: [always]

- name: ssh
  import_tasks: ssh.yml
  tags: [ssh]

- name: nosnapd
  import_tasks: nosnapd.yml
  tags: nosnapd

- name: overwrite /etc/apt/sources.list.d/ubuntu.sources
  unity.copy_multi_diff.copy:
    src: ubuntu.sources
    dest: /etc/apt/sources.list.d/ubuntu.sources
  register: ubuntu_sources

- name: apt update
  apt: { update_cache: true }
  when: ubuntu_sources.changed

- name: apt install
  apt:
    name:
      - neovim
      - xvfb # for headless firefox
      - delta
      - wireguard
      - wpasupplicant # required for wifi
      - net-tools
      - python-is-python3
      - python3-venv
      - jc
      - bat
      # - firefox # gecko selenium webdriver for apartment bot
      - iotop
      - iftop
      - wavemon # top-like tool for wifi
      - nfs-common
      - podman
      - uidmap # used with podman
      - ncdu
      - tree
      - btrbk

- name: remove junk from MOTD
  file:
    path: "/etc/update-motd.d/{{ item }}"
    state: absent
  loop:
    - 10-help-text
    - 50-motd-news
    - 90-updates-available
    - 91-contract-ua-esm-status

- name: disable motd-news
  systemd_service:
    name: motd-news.timer
    enabled: false
    masked: true
  loop:
    - motd-news.timer
    - motd-news.service

- name: set timezone
  community.general.timezone:
    name: America/New_York

- name: network
  import_tasks: network.yml
  tags: [network]

- name: certbot
  import_tasks: certbot.yml
  tags: [certbot]

- name: DDNS
  unity.copy_multi_diff.copy:
    content: |
      */5 * * * * root echo url="https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}" | curl -k -o /var/log/ddns.log -K -
    dest: /etc/cron.d/duckdns
    owner: root
    group: root
    mode: "0600"

