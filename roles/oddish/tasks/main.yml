- name: setup secrets
  include_vars: secrets.yml
  tags: [always]

- name: nosnapd
  import_tasks: nosnapd.yml
  tags: nosnapd

- name: overwrite /etc/apt/sources.list.d/ubuntu.sources
  unity.copy_multi_diff.copy:
    src: ubuntu.sources
    dest: /etc/apt/sources.list.d/ubuntu.sources
  register: ubuntu_sources

- name: apt update
  apt: { update_cache: true }
  when: ubuntu_sources.changed

- name: apt install
  apt:
    name:
      - neovim
      - xvfb # for headless firefox
      - delta
      - wireguard
      - wpasupplicant # required for wifi
      - net-tools
      - python-is-python3
      - jc
      - bat
      - firefox # gecko selenium webdriver for apartment bot
      - iotop
      - iftop
      - wavemon # top-like tool for wifi
      - nfs-common
      - podman
      - uidmap # used with podman

- name: remove junk from MOTD
  file:
    path: "/etc/update-motd.d/{{ item }}"
    state: absent
  loop:
    - 10-help-text
    - 50-motd-news
    - 90-updates-available
    - 91-contract-ua-esm-status

- name: set timezone
  community.general.timezone:
    name: America/New_York

- name: update netplan config
  unity.template_multi_diff.template:
    src: netplan.yml.j2
    dest: /etc/netplan/00-installer-config.yaml
    owner: root
    group: root
    mode: "0600"
  register: netplan_config
  tags: [netplan]

- name: netplan try && netplan apply
  shell: netplan try && netplan apply
  changed_when: true
  when: netplan_config.changed
  tags: [netplan]

- name: certbot
  import_tasks: certbot.yml
  tags: [certbot]

- name: DDNS
  unity.copy_multi_diff.copy:
    content: |
      */5 * * * * root echo url="https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}" | curl -k -o /var/log/ddns.log -K -
    dest: /etc/cron.d/duckdns
    owner: root
    group: root
    mode: "0600"

- name: gitea
  import_tasks: gitea.yml
  tags: [gitea]

- name: wireguard
  import_tasks: wireguard.yml
  tags: [wireguard]

- name: ensure /mnt/bunker-synology-simon exists
  file:
    path: /mnt/bunker-synology-simon
    state: directory
    owner: simon
    group: simon
    mode: "0750"

- name: NFS mount from bunker
  ansible.posix.mount:
    src: "BNKR-NAS:/simon"
    path: /mnt/bunker-synology-simon
    fstype: nfs
    state: mounted

- name: dendrite
  import_tasks: dendrite.yml
  tags: [dendrite]

- name: apache
  import_tasks: apache.yml
  tags: [apache]

- name: hookshot
  import_tasks: hookshot.yml
  tags: [hookshot]

- name: podman
  import_tasks: podman.yml
  tags: [podman]
