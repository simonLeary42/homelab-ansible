# NOTE: podman-related ntfy tasks are in tasks/podman.yml, not tasks/ntfy.yml

- name: create the ntfy group
  ansible.builtin.group:
    name: ntfy
    system: true
    state: present

- name: create the ntfy user account
  ansible.builtin.user:
    name: ntfy
    group: ntfy
    shell: /usr/sbin/nologin
    password_lock: true
    system: true
    create_home: true
    state: present
