- name: setup parent dir for container registry auth file
  unity.file_multi_diff.file:
    path: "/home/{{ item.user }}/.config/containers"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0755"
  loop: "{{ podman_containers }}"
  loop_control: { label: "{{ item.name }}" }
  when: item.requires_dockerhub_login | default(false)

- name: install container registry auth file
  unity.copy_multi_diff.copy:
    content: "{{ data | to_nice_json ~ '\n' }}"
    dest: "/home/{{ item.user }}/.config/containers/auth.json"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0600"
  vars:
    data:
      auths:
        docker.io:
          auth: "{{ (podman_dockerhub_username ~ ':' ~ podman_dockerhub_token) | b64encode }}"
  loop: "{{ podman_containers | rejectattr('defunct', 'defined') }}"
  loop_control: { label: "{{ item.name }}" }
  when: item.requires_dockerhub_login | default(false)

- name: overwrite /etc/subuid, /etc/subgid
  unity.copy_multi_diff.copy:
    content: |
      {% for podman_container in podman_containers %}
      {{ podman_container.user }}:{{ 1000000 + 100000 * loop.index0 }}:65536
      {% endfor %}
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid
  notify: "{{ podman_containers | map(attribute='user') | map('regex_replace', '^(.*)$', 'sudo -u \\1 podman system migrate') }}"

- name: setup user-specific systemd containers directory
  unity.file_multi_diff.file:
    path: "/etc/containers/systemd/users/{{ uid_number }}"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0755"
  loop: "{{ podman_containers | rejectattr('defunct', 'defined') }}"
  loop_control: { label: "{{ item.name }}" }
  vars:
    uid_number: "{{ getent_passwd[item.user][1] }}"

- name: install container unit file
  unity.template_multi_diff.template:
    src: "{{ item.name }}.container.j2"
    dest: "/etc/containers/systemd/users/{{ uid_number }}/{{ item.name }}.container"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0644"
  loop: "{{ podman_containers | rejectattr('defunct', 'defined') }}"
  loop_control: { label: "{{ item.name }}" }
  vars:
    # prometheus polls every 15 seconds, if restart too quickly, failure will go un-noticed
    restart_sec: 30
    uid_number: "{{ getent_passwd[item.user][1] }}"
    uidmap:
      # bidirectional real user <-> container root user
      # allow container root user to access files in a volume owned by the real user
      # make files created by container root user in a volume owned by the real user
      - "0:0:1"
      # use this specific ID range from /etc/subuid
      - "1:{{ 1 + 65536 * item.index }}:65535"
    gidmap: "{{ uidmap }}"
  notify: |
    {% set output = [] %}
    {% for podman_container in (podman_containers | rejectattr('defunct', 'defined')) %}
    {% set _ = output.append('systemctl --user -M ' ~ podman_container.user ~ '@ daemon-reload') %}
    {% set _ = output.append('systemctl --user -M ' ~ podman_container.user ~ '@ restart ' ~ podman_container.name) %}
    {% endfor %}
    {{ output }}

- name: validate container unit files
  command: /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun
  become: true
  become_user: "{{ item }}"
  changed_when: false
  loop: "{{ podman_containers | rejectattr('defunct', 'defined') | map(attribute='user') | unique }}"
  register: _result
  failed_when: (_result.rc != 0) or ((_result.stdout | trim) == "")

- name: loginctl enable-linger
  ansible.builtin.command:
    cmd: loginctl enable-linger "{{ item.user }}"
    creates: "/var/lib/systemd/linger/{{ item.user }}"
  loop: "{{ podman_containers | rejectattr('defunct', 'defined') }}"
  loop_control: { label: "{{ item.name }}" }

# needed for grype
- name: enable, start podman.socket
  systemd:
    name: podman.socket
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ item }}"
  loop: "{{ podman_containers | rejectattr('defunct', 'defined') | map(attribute='user') | unique }}"

- name: install su-systemctl helper script
  copy:
    content: |
      #!/bin/bash
      user=$1
      shift
      set -x
      systemd-run --pipe --quiet --user --machine="$user@" /usr/bin/systemctl --user "$@"
    dest: /usr/local/sbin/su-systemctl
    owner: root
    group: root
    mode: "0755"

- name: install systemd_user_service_exporter.py
  copy:
    src: systemd_user_service_exporter.py
    dest: /usr/local/sbin/systemd_user_service_exporter.py
    owner: root
    group: root
    mode: "0755"
  notify: "{{ podman_containers | rejectattr('defunct', 'defined') | map(attribute='user') | unique | map('regex_replace', '^(.*)$', 'systemctl restart systemd_user_service_exporter-\\1') }}"

- name: install systemd_user_service_exporter-USERNAME_HERE.service
  copy:
    content: |
      [Unit]
      Description=homemade python http server to display results of `systemctl --user show ...` for {{ item }}'s services
      [Service]
      Type=simple
      User={{ item }}
      Environment=XDG_RUNTIME_DIR=/run/user/{{ getent_passwd[item][1] }}
      ExecStart=/usr/local/sbin/systemd_user_service_exporter.py {{ _services | join(' ') }}
      Restart=on-failure
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/systemd_user_service_exporter-{{ item }}.service
    owner: root
    group: root
    mode: "0644"
  loop: "{{ podman_containers | rejectattr('defunct', 'defined') | map(attribute='user') | unique }}"
  vars:
    _services: "{{ podman_containers | rejectattr('defunct', 'defined') | selectattr('user', 'equalto', item) | map(attribute='name') }}"
  notify: "systemctl restart systemd_user_service_exporter-{{ item }}"

- name: systemctl enable systemd_user_service_exporter-USERNAME_HERE
  systemd_service:
    name: "systemd_user_service_exporter-{{ item }}"
    enabled: true
  loop: "{{ podman_containers | rejectattr('defunct', 'defined') | map(attribute='user') | unique }}"

- name: check if grype installed
  stat: { path: /usr/local/bin/grype }
  register: usr_local_bin_grype

- name: check grype version
  shell: set -o pipefail; grype --version | awk '{print $2}'
  register: installed_grype_version
  changed_when: false
  check_mode: false
  when: usr_local_bin_grype.stat.exists

- name: install/upgrade grype
  when: (installed_grype_version.stdout | default("") | trim) != grype_version
  block:
    - name: download and extract tarball
      unarchive:
        src: "https://github.com/anchore/grype/releases/download/v{{ grype_version }}/grype_{{ grype_version }}_linux_amd64.tar.gz"
        dest: /tmp/
        remote_src: true
    - name: copy grype binary
      copy:
        src: "/tmp/grype"
        dest: /usr/local/bin/grype
        owner: root
        group: root
        mode: "0755"
        remote_src: true

- name: install grype script
  unity.template_multi_diff.template:
    src: grype-everything.bash.j2
    dest: /usr/local/sbin/grype-everything.bash
    owner: root
    group: root
    mode: "0754"

- name: install grype-everything.service
  unity.copy_multi_diff.copy:
    src: grype-everything.service
    dest: /etc/systemd/system/grype-everything.service
    owner: root
    group: root
    mode: "0644"
  notify: systemctl daemon-reload

- name: install grype-everything.timer
  unity.copy_multi_diff.copy:
    src: grype-everything.timer
    dest: /etc/systemd/system/grype-everything.timer
    owner: root
    group: root
    mode: "0644"
  notify: systemctl daemon-reload

- name: systemctl enable grype-everything.timer
  systemd_service:
    name: grype-everything.timer
    enabled: true
    state: started
