node_exporter_version: 1.12.1
# NOTE: each user needs to have their own handlers added to handlers/main.yml
# NOTE: each container needs to have its own handler added to handlers/main.yml
# NOTE: `index` must be incremented if there are multiple containers for the same user
# NOTE: `defunct` can be defined (arbitrary value) to keep the subuid/subgid ranges but ignore all else
podman_containers:
  - user: simon
    name: hello
    index: 0
  - user: hookshot
    name: matrix-hookshot
    index: 0
    defunct: true
  - user: simon
    name: hello2
    index: 1
  - user: synapse
    name: matrix-synapse
    index: 0
    defunct: true
  - user: prometheus
    name: prometheus
    index: 0
  - user: grafana
    name: grafana
    index: 0
    requires_dockerhub_login: true
  - user: alertmanager
    name: alertmanager
    index: 0
